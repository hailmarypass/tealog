<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tealog - 나의 차 기록</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: 전통적인 분위기를 위한 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Gowun Batang"', 'serif'],
                        title: ['"Nanum Myeongjo"', 'serif'],
                    },
                    colors: {
                        tea: {
                            50: '#f0f5ff',
                            100: '#e5edff',
                            200: '#cddbfe',
                            300: '#a4bffe',
                            400: '#769cfc',
                            500: '#6495ED', /* Cornflower Blue (콘플라워) */
                            600: '#4f72f6',
                            700: '#2836c8', /* Navy (남색) */
                            800: '#252ea3',
                            900: '#1a1f6c',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent body scroll, handle inside app container */
            font-family: 'Gowun Batang', serif;
        }

        /* 깅엄 체크 무늬 배경 (개나리색) 및 흐림 효과 */
        .bg-checkered {
            position: fixed;
            top: -10px; /* 블러 처리 시 가장자리 흰 여백 방지 */
            left: -10px;
            right: -10px;
            bottom: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 20px);
            background-color: #fefce8; /* 아주 연한 바탕색 */
            background-image: 
                linear-gradient(90deg, rgba(250, 204, 21, 0.35) 50%, transparent 50%),
                linear-gradient(rgba(250, 204, 21, 0.35) 50%, transparent 50%);
            background-size: 60px 60px;
            filter: blur(4px); /* 배경을 더 흐리게 처리 */
            z-index: -1;
        }

        /* 유리 질감 (Glassmorphism) 패널 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        /* 별점 스타일 */
        .star-rating input { display: none; }
        .star-rating label {
            color: #d1d5db;
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        .star-rating input:checked ~ label { color: #d1d5db; }
        .star-rating label:hover,
        .star-rating label:hover ~ label,
        .star-rating input:checked ~ label:hover,
        .star-rating input:checked ~ label:hover ~ label,
        .star-rating input:checked + label,
        .star-rating input:checked + label ~ label {
            color: #6495ED; /* Cornflower Blue */
        }
        
        .star-rating-display i { color: #6495ED; }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(100, 149, 237, 0.5); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(100, 149, 237, 0.8); }

        /* 캔버스 아이템 호버 효과 */
        .tea-card:hover .tea-card-overlay { opacity: 1; }
    </style>
</head>
<body class="text-tea-900 h-screen w-screen relative flex items-center justify-center">

    <!-- 체크무늬 배경 레이어 -->
    <div class="bg-checkered"></div>

    <!-- 메인 앱 컨테이너 (떠 있는 창) -->
    <div class="glass-panel w-full max-w-5xl h-[90vh] md:h-[85vh] rounded-2xl flex flex-col mx-4 overflow-hidden relative">
        
        <!-- 헤더 / 네비게이션 -->
        <header class="flex justify-between items-center px-8 py-5 border-b border-white/40 bg-white/40">
            <h1 class="text-3xl font-title font-bold text-tea-900 tracking-wider">tealog<span class="text-sm font-sans font-normal ml-2 text-tea-700">나의 차 기록</span></h1>
            <nav class="flex space-x-4">
                <button onclick="switchTab('tealog')" id="tab-tealog" class="px-4 py-2 rounded-lg font-bold bg-tea-600 text-white shadow transition-all">나의 다실</button>
                <button onclick="switchTab('wishlist')" id="tab-wishlist" class="px-4 py-2 rounded-lg font-medium text-tea-800 hover:bg-white/50 transition-all">위시리스트</button>
            </nav>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main class="flex-1 overflow-y-auto p-6 md:p-8 relative" id="main-content">
            
            <!-- 1. Tealog 캔버스 뷰 -->
            <div id="view-tealog" class="block">
                <div class="flex justify-between items-end mb-6">
                    <h2 class="text-2xl font-title text-tea-800 border-b-2 border-tea-300 pb-1 inline-block">기록된 차</h2>
                    <button onclick="openModal('addTeaModal')" class="bg-tea-500 hover:bg-tea-600 text-white px-5 py-2 rounded-full shadow-md transition-transform transform hover:scale-105 flex items-center gap-2">
                        <i class="fas fa-plus"></i> 차 기록하기
                    </button>
                </div>
                
                <!-- 차 목록 그리드 -->
                <div id="tea-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    <!-- JS로 렌더링 됨 -->
                </div>
                <div id="empty-tea-msg" class="hidden text-center py-20 text-tea-700/60 flex flex-col items-center">
                    <i class="fas fa-mug-hot text-5xl mb-4 opacity-50"></i>
                    <p class="text-lg">아직 기록된 차가 없습니다.<br>오른쪽 위 버튼을 눌러 첫 번째 차를 기록해보세요.</p>
                </div>
            </div>

            <!-- 2. Wishlist 뷰 -->
            <div id="view-wishlist" class="hidden">
                <h2 class="text-2xl font-title text-tea-800 border-b-2 border-tea-300 pb-1 inline-block mb-6">사고 싶은 차</h2>
                
                <!-- 위시리스트 추가 폼 -->
                <form id="wishlist-form" class="bg-white/50 p-5 rounded-xl shadow-sm border border-white/50 mb-8 flex flex-col gap-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="w-full">
                            <label class="block text-sm text-tea-800 mb-1">브랜드</label>
                            <input type="text" id="wish-brand" class="w-full bg-white/70 border border-tea-200 rounded-lg px-4 py-2 focus:outline-none focus:border-tea-500" placeholder="예: 오설록, TWG">
                        </div>
                        <div class="w-full">
                            <label class="block text-sm text-tea-800 mb-1">차 이름 *</label>
                            <input type="text" id="wish-name" required class="w-full bg-white/70 border border-tea-200 rounded-lg px-4 py-2 focus:outline-none focus:border-tea-500" placeholder="예: 우전 녹차">
                        </div>
                        <div class="w-full">
                            <label class="block text-sm text-tea-800 mb-1">차 정보</label>
                            <input type="text" id="wish-info" class="w-full bg-white/70 border border-tea-200 rounded-lg px-4 py-2 focus:outline-none focus:border-tea-500" placeholder="예: 2023년 햇차, 50g 틴케이스">
                        </div>
                        <div class="w-full">
                            <label class="block text-sm text-tea-800 mb-1">판매 사이트 링크</label>
                            <input type="url" id="wish-link" class="w-full bg-white/70 border border-tea-200 rounded-lg px-4 py-2 focus:outline-none focus:border-tea-500" placeholder="https://...">
                        </div>
                    </div>
                    <div class="flex justify-end mt-2">
                        <button type="submit" class="w-full md:w-auto bg-tea-700 hover:bg-tea-800 text-white px-8 py-2 rounded-lg shadow transition-colors font-medium">추가하기</button>
                    </div>
                </form>

                <!-- 위시리스트 목록 -->
                <div class="bg-white/40 rounded-xl border border-white/50 overflow-hidden shadow-sm">
                    <ul id="wishlist-ul" class="divide-y divide-tea-200/50">
                        <!-- JS로 렌더링 됨 -->
                    </ul>
                </div>
                <div id="empty-wish-msg" class="hidden text-center py-10 text-tea-700/60">
                    <p>위시리스트가 비어있습니다.</p>
                </div>
            </div>

        </main>
    </div>

    <!-- 모달: 차 기록하기 -->
    <div id="addTeaModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-tea-50 w-full max-w-2xl rounded-2xl shadow-2xl p-6 md:p-8 transform scale-95 transition-transform duration-300 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal('addTeaModal')" class="absolute top-4 right-5 text-gray-400 hover:text-gray-700 text-2xl">&times;</button>
            <h2 class="text-2xl font-title text-tea-900 mb-6 border-b border-tea-200 pb-2"><i class="fas fa-leaf text-tea-500 mr-2"></i>새로운 차 기록</h2>
            
            <form id="add-tea-form" class="space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <!-- 이미지 업로드 -->
                    <div class="col-span-1 md:col-span-2">
                        <label class="block text-tea-800 font-medium mb-2">사진</label>
                        <div class="flex flex-col items-center justify-center w-full">
                            <label for="tea-image" class="flex flex-col items-center justify-center w-full h-48 border-2 border-tea-300 border-dashed rounded-xl cursor-pointer bg-white/50 hover:bg-white transition-colors relative overflow-hidden" id="img-preview-container">
                                <div class="flex flex-col items-center justify-center pt-5 pb-6" id="img-upload-prompt">
                                    <i class="fas fa-camera text-3xl text-tea-400 mb-3"></i>
                                    <p class="text-sm text-tea-600">클릭하여 사진 업로드</p>
                                </div>
                                <img id="img-preview" class="hidden absolute inset-0 w-full h-full object-cover">
                                <input id="tea-image" type="file" accept="image/*" class="hidden" onchange="previewImage(event)" />
                            </label>
                            
                            <!-- 이미지 위치 조절 (업로드 시 표시됨) -->
                            <div id="img-position-controls" class="hidden w-full mt-3 space-y-2 bg-white/40 p-3 rounded-lg border border-tea-200">
                                <label class="block text-xs text-tea-700 font-medium">이미지 표시 위치 조절</label>
                                <div class="flex items-center gap-3">
                                    <span class="text-xs text-tea-600 w-8">가로</span>
                                    <input type="range" id="img-pos-x" min="0" max="100" value="50" class="flex-1 accent-tea-500" oninput="updateImagePosition()">
                                </div>
                                <div class="flex items-center gap-3">
                                    <span class="text-xs text-tea-600 w-8">세로</span>
                                    <input type="range" id="img-pos-y" min="0" max="100" value="50" class="flex-1 accent-tea-500" oninput="updateImagePosition()">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 기본 정보 -->
                    <div>
                        <label class="block text-tea-800 font-medium mb-1">차 이름 *</label>
                        <input type="text" id="tea-name" required class="w-full bg-white border border-tea-200 rounded-lg px-4 py-2 focus:ring-2 focus:ring-tea-400 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-tea-800 font-medium mb-1">차 정보</label>
                        <input type="text" id="tea-info" placeholder="예: 브랜드, 산지, 발효도 등" class="w-full bg-white border border-tea-200 rounded-lg px-4 py-2 focus:ring-2 focus:ring-tea-400 focus:outline-none">
                    </div>
                    
                    <!-- 테이스팅 노트 -->
                    <div>
                        <label class="block text-tea-800 font-medium mb-1">향 (Aroma)</label>
                        <input type="text" id="tea-aroma" placeholder="예: 난초향, 구수한 향" class="w-full bg-white border border-tea-200 rounded-lg px-4 py-2 focus:ring-2 focus:ring-tea-400 focus:outline-none">
                    </div>
                    
                    <div class="flex flex-col justify-center">
                        <label class="block text-tea-800 font-medium mb-1 flex justify-between">
                            <span>산미 (Acidity)</span>
                            <span id="acidity-val" class="text-tea-500 text-sm">보통</span>
                        </label>
                        <input type="range" id="tea-acidity" min="1" max="5" value="3" class="w-full accent-tea-600" oninput="updateAcidityLabel(this.value)">
                        <div class="flex justify-between text-xs text-gray-400 mt-1">
                            <span>낮음</span><span>높음</span>
                        </div>
                    </div>

                    <!-- 별점 -->
                    <div class="col-span-1 md:col-span-2">
                        <label class="block text-tea-800 font-medium mb-1">별점</label>
                        <div class="star-rating flex flex-row-reverse justify-end text-2xl w-max">
                            <input type="radio" id="star5" name="rating" value="5" /><label for="star5" class="fas fa-star"></label>
                            <input type="radio" id="star4" name="rating" value="4" /><label for="star4" class="fas fa-star"></label>
                            <input type="radio" id="star3" name="rating" value="3" checked /><label for="star3" class="fas fa-star"></label>
                            <input type="radio" id="star2" name="rating" value="2" /><label for="star2" class="fas fa-star"></label>
                            <input type="radio" id="star1" name="rating" value="1" /><label for="star1" class="fas fa-star"></label>
                        </div>
                    </div>

                    <!-- 한줄평 -->
                    <div class="col-span-1 md:col-span-2">
                        <label class="block text-tea-800 font-medium mb-1">한줄평 *</label>
                        <textarea id="tea-review" required rows="2" placeholder="이 차에 대한 짧은 감상을 남겨주세요." class="w-full bg-white border border-tea-200 rounded-lg px-4 py-2 focus:ring-2 focus:ring-tea-400 focus:outline-none resize-none"></textarea>
                    </div>
                </div>
                
                <div class="mt-6 flex justify-end gap-3 pt-4 border-t border-tea-200">
                    <button type="button" onclick="closeModal('addTeaModal')" class="px-5 py-2 rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors">취소</button>
                    <button type="submit" class="px-6 py-2 rounded-lg bg-tea-700 text-white hover:bg-tea-800 transition-colors font-medium">기록 저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 모달: 차 상세 정보 보기 -->
    <div id="viewTeaModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-tea-50 w-full max-w-3xl rounded-2xl shadow-2xl flex flex-col md:flex-row overflow-hidden transform scale-95 transition-transform duration-300 max-h-[90vh]">
            <!-- 이미지 영역 -->
            <div class="w-full md:w-1/2 h-64 md:h-auto relative bg-tea-900">
                <img id="detail-image" src="" alt="Tea Image" class="w-full h-full object-cover opacity-90">
                <button onclick="closeModal('viewTeaModal')" class="md:hidden absolute top-3 right-3 w-8 h-8 bg-black/50 text-white rounded-full flex items-center justify-center hover:bg-black/70">&times;</button>
            </div>
            
            <!-- 정보 영역 -->
            <div class="w-full md:w-1/2 p-6 md:p-8 flex flex-col relative overflow-y-auto">
                <button onclick="closeModal('viewTeaModal')" class="hidden md:block absolute top-4 right-5 text-gray-400 hover:text-gray-700 text-2xl">&times;</button>
                
                <div class="mb-4">
                    <span id="detail-date" class="text-xs font-sans text-tea-500 mb-1 block"></span>
                    <h2 id="detail-name" class="text-3xl font-title text-tea-900 font-bold mb-2"></h2>
                    <div class="flex items-center text-sm text-tea-700 gap-4 mb-4">
                        <span class="flex items-center gap-1"><i class="fas fa-tag"></i> <span id="detail-info"></span></span>
                        <span id="detail-stars" class="star-rating-display text-base"></span>
                    </div>
                </div>

                <div class="space-y-4 flex-1">
                    <div class="bg-white/60 p-4 rounded-xl border border-tea-100 shadow-sm">
                        <p class="text-xs text-tea-500 uppercase tracking-widest mb-1 font-sans">한줄평</p>
                        <p id="detail-review" class="text-tea-900 leading-relaxed text-lg"></p>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-white/60 p-4 rounded-xl border border-tea-100 shadow-sm">
                            <p class="text-xs text-tea-500 uppercase tracking-widest mb-1 font-sans">향 (Aroma)</p>
                            <p id="detail-aroma" class="text-tea-800 font-medium"></p>
                        </div>
                        <div class="bg-white/60 p-4 rounded-xl border border-tea-100 shadow-sm">
                            <p class="text-xs text-tea-500 uppercase tracking-widest mb-1 font-sans">산미 (Acidity)</p>
                            <div class="flex items-center gap-2">
                                <div class="flex-1 h-2 bg-tea-200 rounded-full overflow-hidden">
                                    <div id="detail-acidity-bar" class="h-full bg-tea-600"></div>
                                </div>
                                <span id="detail-acidity-text" class="text-sm text-tea-700 font-medium w-10 text-right"></span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="mt-8 flex justify-end">
                    <button id="btn-delete-tea" class="text-red-400 hover:text-red-600 text-sm flex items-center gap-1 transition-colors">
                        <i class="fas fa-trash-alt"></i> 기록 삭제
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Javascript Logic -->
    <script>
        // Data Arrays
        let teas = JSON.parse(localStorage.getItem('tealog_entries')) || [];
        let wishlist = JSON.parse(localStorage.getItem('tealog_wishlist')) || [];
        
        let currentUploadedImageBase64 = null;
        let currentImagePosition = "50% 50%";
        let currentDetailTeaId = null;

        // Default Tea Image placeholder if none uploaded
        const DEFAULT_IMAGE = "https://images.unsplash.com/photo-1594489428504-5c0c480a15fd?q=80&w=800&auto=format&fit=crop";

        // DOM Elements
        const teaGrid = document.getElementById('tea-grid');
        const wishlistUl = document.getElementById('wishlist-ul');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderTeas();
            renderWishlist();
        });

        // Tab Switching
        function switchTab(tabName) {
            document.getElementById('view-tealog').classList.toggle('hidden', tabName !== 'tealog');
            document.getElementById('view-wishlist').classList.toggle('hidden', tabName !== 'wishlist');
            
            // Button styling
            const btnTealog = document.getElementById('tab-tealog');
            const btnWishlist = document.getElementById('tab-wishlist');
            
            if(tabName === 'tealog') {
                btnTealog.className = "px-4 py-2 rounded-lg font-bold bg-tea-600 text-white shadow transition-all";
                btnWishlist.className = "px-4 py-2 rounded-lg font-medium text-tea-800 hover:bg-white/50 transition-all";
            } else {
                btnWishlist.className = "px-4 py-2 rounded-lg font-bold bg-tea-600 text-white shadow transition-all";
                btnTealog.className = "px-4 py-2 rounded-lg font-medium text-tea-800 hover:bg-white/50 transition-all";
            }
        }

        // Modal Controls
        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.remove('hidden');
            // Trigger reflow
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            modal.children[0].classList.remove('scale-95');
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.add('opacity-0');
            modal.children[0].classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                if(modalId === 'addTeaModal') resetForm();
            }, 300);
        }

        // Add Tea Form Handling
        document.getElementById('add-tea-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get rating
            let rating = 3; // default
            const rates = document.getElementsByName('rating');
            for(let r of rates){
                if(r.checked){
                    rating = parseInt(r.value);
                    break;
                }
            }

            const newTea = {
                id: Date.now().toString(),
                name: document.getElementById('tea-name').value,
                info: document.getElementById('tea-info').value || '정보 없음',
                aroma: document.getElementById('tea-aroma').value || '기록 안함',
                acidity: document.getElementById('tea-acidity').value,
                rating: rating,
                review: document.getElementById('tea-review').value,
                image: currentUploadedImageBase64 || DEFAULT_IMAGE,
                imagePos: currentImagePosition,
                date: new Date().toLocaleDateString('ko-KR')
            };

            teas.unshift(newTea);
            saveTeas();
            renderTeas();
            closeModal('addTeaModal');
        });

        function resetForm() {
            document.getElementById('add-tea-form').reset();
            document.getElementById('star3').checked = true;
            updateAcidityLabel('3');
            
            currentUploadedImageBase64 = null;
            currentImagePosition = "50% 50%";
            document.getElementById('img-pos-x').value = 50;
            document.getElementById('img-pos-y').value = 50;
            
            const preview = document.getElementById('img-preview');
            preview.src = "";
            preview.style.objectPosition = "50% 50%";
            preview.classList.add('hidden');
            
            document.getElementById('img-upload-prompt').classList.remove('hidden');
            document.getElementById('img-position-controls').classList.add('hidden');
        }

        function updateAcidityLabel(val) {
            const labels = ["매우 낮음", "낮음", "보통", "높음", "매우 높음"];
            document.getElementById('acidity-val').innerText = labels[parseInt(val)-1];
        }

        // Image Preview (File to Base64 - Canvas resize to prevent massive localStorage)
        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // Resize to max 800px width/height to save space
                    const MAX_SIZE = 800;
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > height) {
                        if (width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        }
                    } else {
                        if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }
                    }
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Convert to base64 jpeg
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    
                    currentUploadedImageBase64 = dataUrl;
                    const preview = document.getElementById('img-preview');
                    preview.src = dataUrl;
                    preview.classList.remove('hidden');
                    document.getElementById('img-upload-prompt').classList.add('hidden');
                    
                    // Show position controls and reset sliders
                    document.getElementById('img-position-controls').classList.remove('hidden');
                    document.getElementById('img-pos-x').value = 50;
                    document.getElementById('img-pos-y').value = 50;
                    updateImagePosition();
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        // Handle Image Position Sliders
        function updateImagePosition() {
            const x = document.getElementById('img-pos-x').value;
            const y = document.getElementById('img-pos-y').value;
            currentImagePosition = `${x}% ${y}%`;
            document.getElementById('img-preview').style.objectPosition = currentImagePosition;
        }

        // Render Teas (Canvas View)
        function renderTeas() {
            teaGrid.innerHTML = '';
            
            if (teas.length === 0) {
                document.getElementById('empty-tea-msg').classList.remove('hidden');
            } else {
                document.getElementById('empty-tea-msg').classList.add('hidden');
                
                teas.forEach(tea => {
                    const card = document.createElement('div');
                    card.className = "tea-card relative group bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-xl transition-all cursor-pointer aspect-[3/4] flex flex-col";
                    card.onclick = () => showTeaDetail(tea.id);
                    
                    card.innerHTML = `
                        <div class="h-3/4 w-full overflow-hidden relative">
                            <img src="${tea.image}" alt="${tea.name}" style="object-position: ${tea.imagePos || '50% 50%'};" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                            <!-- 오버레이 -->
                            <div class="tea-card-overlay absolute inset-0 bg-black/40 opacity-0 transition-opacity flex items-center justify-center text-white">
                                <span class="font-bold border border-white px-4 py-2 rounded-lg backdrop-blur-sm">자세히 보기</span>
                            </div>
                        </div>
                        <div class="h-1/4 p-3 flex flex-col justify-center bg-tea-50">
                            <h3 class="font-title font-bold text-tea-900 truncate text-lg">${tea.name}</h3>
                            <div class="flex justify-between items-center mt-1">
                                <span class="text-xs text-tea-600 truncate max-w-[60%]"><i class="fas fa-tag text-[10px] mr-1"></i>${tea.info || tea.location || '정보 없음'}</span>
                                <div class="text-tea-500 text-xs">
                                    <i class="fas fa-star"></i> ${tea.rating}
                                </div>
                            </div>
                        </div>
                    `;
                    teaGrid.appendChild(card);
                });
            }
        }

        // Show Detail Modal
        function showTeaDetail(id) {
            const tea = teas.find(t => t.id === id);
            if(!tea) return;

            currentDetailTeaId = id;
            
            const detailImg = document.getElementById('detail-image');
            detailImg.src = tea.image;
            detailImg.style.objectPosition = tea.imagePos || '50% 50%';
            
            document.getElementById('detail-name').innerText = tea.name;
            document.getElementById('detail-date').innerText = tea.date;
            document.getElementById('detail-info').innerText = tea.info || tea.location || '정보 없음';
            document.getElementById('detail-review').innerText = tea.review;
            document.getElementById('detail-aroma').innerText = tea.aroma;
            
            // Render Stars
            let starsHtml = '';
            for(let i=0; i<5; i++){
                starsHtml += `<i class="fas fa-star ${i < tea.rating ? 'text-tea-500' : 'text-gray-300'}"></i>`;
            }
            document.getElementById('detail-stars').innerHTML = starsHtml;

            // Render Acidity Bar
            const acidityLabels = ["매우 낮음", "낮음", "보통", "높음", "매우 높음"];
            const acidityPercent = (tea.acidity / 5) * 100;
            document.getElementById('detail-acidity-bar').style.width = `${acidityPercent}%`;
            document.getElementById('detail-acidity-text').innerText = acidityLabels[tea.acidity - 1];

            // Delete button setup
            document.getElementById('btn-delete-tea').onclick = function() {
                if(confirm('이 차 기록을 정말 삭제하시겠습니까?')) {
                    teas = teas.filter(t => t.id !== id);
                    saveTeas();
                    renderTeas();
                    closeModal('viewTeaModal');
                }
            };

            openModal('viewTeaModal');
        }

        // Wishlist Form Handling
        document.getElementById('wishlist-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const brandInput = document.getElementById('wish-brand');
            const nameInput = document.getElementById('wish-name');
            const infoInput = document.getElementById('wish-info');
            const linkInput = document.getElementById('wish-link');
            
            let linkStr = linkInput.value.trim();
            if(linkStr && !/^https?:\/\//i.test(linkStr)){
                linkStr = 'http://' + linkStr;
            }

            const newItem = {
                id: Date.now().toString(),
                brand: brandInput.value,
                name: nameInput.value,
                info: infoInput.value,
                link: linkStr
            };

            wishlist.push(newItem);
            saveWishlist();
            renderWishlist();
            
            brandInput.value = '';
            nameInput.value = '';
            infoInput.value = '';
            linkInput.value = '';
        });

        function renderWishlist() {
            wishlistUl.innerHTML = '';
            if (wishlist.length === 0) {
                document.getElementById('empty-wish-msg').classList.remove('hidden');
                wishlistUl.parentElement.classList.add('hidden');
            } else {
                document.getElementById('empty-wish-msg').classList.add('hidden');
                wishlistUl.parentElement.classList.remove('hidden');

                wishlist.forEach(item => {
                    const li = document.createElement('li');
                    li.className = "flex items-center justify-between p-5 hover:bg-white/60 transition-colors";
                    
                    let brandHtml = item.brand ? `<span class="inline-block bg-tea-200 text-tea-800 text-[11px] px-2 py-0.5 rounded-full mr-2 align-middle border border-tea-300 font-sans">${item.brand}</span>` : '';
                    let infoHtml = item.info ? `<p class="text-sm text-tea-700 mt-1.5"><i class="fas fa-info-circle text-[10px] text-tea-400 mr-1"></i>${item.info}</p>` : '';
                    let linkHtml = item.link ? `<a href="${item.link}" target="_blank" class="inline-flex text-sm text-blue-600 hover:text-blue-800 underline items-center gap-1 mt-1.5"><i class="fas fa-external-link-alt text-[10px]"></i> 구매처 보기</a>` : `<span class="text-sm text-gray-400 mt-1.5 block">링크 없음</span>`;

                    li.innerHTML = `
                        <div class="flex-1 pr-4">
                            <h4 class="font-title text-lg font-bold text-tea-900 flex items-center flex-wrap gap-y-1">${brandHtml}${item.name}</h4>
                            ${infoHtml}
                            ${linkHtml}
                        </div>
                        <button onclick="deleteWishItem('${item.id}')" class="w-9 h-9 rounded-full text-red-300 hover:text-white hover:bg-red-400 transition-colors flex items-center justify-center flex-shrink-0 shadow-sm">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    `;
                    wishlistUl.appendChild(li);
                });
            }
        }

        function deleteWishItem(id) {
            wishlist = wishlist.filter(item => item.id !== id);
            saveWishlist();
            renderWishlist();
        }

        // Local Storage Helpers
        function saveTeas() {
            localStorage.setItem('tealog_entries', JSON.stringify(teas));
        }
        function saveWishlist() {
            localStorage.setItem('tealog_wishlist', JSON.stringify(wishlist));
        }
    </script>
</body>
</html>
